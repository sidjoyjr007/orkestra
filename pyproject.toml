[project]
name = "orkestra"
version = "0.1.0"
description = "A universal agent orchestration framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=0.4.0",

    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "google-genai>=0.2.0",
    "anthropic>=0.15.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
